name: assessment-core-ci

on:
  push:
    branches:
      - main
      - "product/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Package smoke test
        run: |
          mkdir -p /tmp/sky-assessment-package
          pnpm pack --pack-destination /tmp/sky-assessment-package
          test -n "$(find /tmp/sky-assessment-package -name '*.tgz' -print -quit)"
